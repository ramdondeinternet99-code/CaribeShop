name: Pruebas de falla P2

on:
  workflow_dispatch:
    inputs:
      tipo_falla:
        description: "Tipo de falla (logica o abrupta)"
        required: true
        default: "logica"
        type: choice
        options:
          - logica
          - abrupta
      instance_id:
        description: "ID o indice de instancia del VMSS"
        required: true
        default: "1"
        type: string

jobs:
  prueba-p2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias de Python para monitoreo y analisis
        run: pip install requests locust

      - name: Iniciar sesion en Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Ejecutar falla logica (P2.1)
        if: ${{ inputs.tipo_falla == 'logica' }}
        env:
          APP_URL: ${{ vars.APP_URL }}
          INST_ID: ${{ inputs.instance_id }}
        run: |
          mkdir -p evidencias/p2
          python3 scripts/monitor.py "$APP_URL" evidencias/p2/monitor_logica.csv &
          MON_PID=$!
          sleep 5
          bash scripts/falla_logica.sh "$INST_ID"
          sleep 60
          bash scripts/restaurar_salud.sh "$INST_ID" || true
          sleep 20
          kill "$MON_PID" || true
          python3 scripts/analizar_falla.py evidencias/p2/monitor_logica.csv | tee evidencias/p2/resumen_logica.txt

      - name: Ejecutar falla abrupta (P2.2)
        if: ${{ inputs.tipo_falla == 'abrupta' }}
        env:
          APP_URL: ${{ vars.APP_URL }}
          INST_ID: ${{ inputs.instance_id }}
        run: |
          mkdir -p evidencias/p2
          python3 scripts/monitor.py "$APP_URL" evidencias/p2/monitor_abrupta.csv &
          MON_PID=$!
          sleep 5
          bash scripts/falla_abrupta.sh "$INST_ID"
          sleep 120
          kill "$MON_PID" || true
          python3 scripts/analizar_falla.py evidencias/p2/monitor_abrupta.csv | tee evidencias/p2/resumen_abrupta.txt

      - name: Subir evidencias de P2
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-p2-${{ inputs.tipo_falla }}
          path: evidencias/p2/
